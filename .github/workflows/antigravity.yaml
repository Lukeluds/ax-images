name: antigravity

on:
  pull_request:
    paths:
      - 'agents/antigravity/**'
      - '.github/workflows/antigravity.yaml'
  push:
    branches: [main]
    paths:
      - 'agents/antigravity/**'
      - '.github/workflows/antigravity.yaml'
  workflow_dispatch:
    inputs:
      agy_version:
        description: 'Antigravity CLI version pinned in install-agy.sh (empty uses the pinned default)'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-test:
    name: Launcher unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test ax-harness launcher
        run: agents/antigravity/test_harness.sh
      - name: Dockerfile AGY_VERSION matches install-agy.sh
        run: |
          pinned="$(sed -n 's/^PINNED_VERSION="\(.*\)"$/\1/p' agents/antigravity/install-agy.sh)"
          arg="$(sed -n 's/^ARG AGY_VERSION=//p' agents/antigravity/Dockerfile)"
          if [[ -z "${pinned}" || "${pinned}" != "${arg}" ]]; then
            echo "::error::Dockerfile ARG AGY_VERSION=${arg} must equal PINNED_VERSION=${pinned} in install-agy.sh"
            exit 1
          fi

  build-and-verify:
    name: Build & verify (${{ matrix.arch }})
    needs: unit-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      # Empty builds the Dockerfile's AGY_VERSION (the version pinned in
      # install-agy.sh).
      AGY_VERSION: ${{ inputs.agy_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Both builds are checked explicitly, so the checks don't depend on the
      # Dockerfile's default. Releases always build PREINSTALL_AGY=false (see
      # release.yaml) until the licensing question in #15 is answered.
      - name: Build and verify the runtime-install image (no agy inside)
        run: |
          img="ax-antigravity:runtime-${{ matrix.arch }}"
          docker build \
            --build-arg PREINSTALL_AGY=false \
            ${AGY_VERSION:+--build-arg "AGY_VERSION=${AGY_VERSION}"} \
            -t "${img}" \
            agents/antigravity
          agents/antigravity/verify_image.sh "${img}" runtime

      - name: Build and verify the bundled image (pinned agy inside, not pushed)
        run: |
          img="ax-antigravity:bundled-${{ matrix.arch }}"
          docker build \
            --build-arg PREINSTALL_AGY=true \
            ${AGY_VERSION:+--build-arg "AGY_VERSION=${AGY_VERSION}"} \
            -t "${img}" \
            agents/antigravity
          agents/antigravity/verify_image.sh "${img}" bundled
          docker rmi "${img}" >/dev/null
