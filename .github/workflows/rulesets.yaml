# Compares .github/rulesets/*.json with the rulesets live on GitHub.
# See docs/rulesets.md. Actions are pinned by commit SHA (version in the
# trailing comment).
name: rulesets

on:
  # Show reviewers what a ruleset change would do once applied.
  pull_request:
    branches: [main]
    paths:
      - '.github/rulesets/**'
      - '.github/workflows/rulesets.yaml'
      - 'scripts/apply-rulesets.sh'
  # Fail when the live rulesets drift from the files, for example after a
  # merged change that no admin has applied yet, or an edit in the UI.
  schedule:
    - cron: '0 7 * * *' # every day at 07:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rulesets:
    name: Rulesets match the repository
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to 26.04 from 2026-10-19; bump deliberately
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show differences from the live rulesets
        if: github.event_name == 'pull_request'
        run: scripts/apply-rulesets.sh --dry-run

      - name: Check for drift from the live rulesets
        if: github.event_name != 'pull_request'
        run: scripts/apply-rulesets.sh --check
